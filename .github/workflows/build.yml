name: Build plugin

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Jellyfin.Plugin.RecentlyAddedBadges/Jellyfin.Plugin.RecentlyAddedBadges.csproj

      - name: Build
        run: dotnet build src/Jellyfin.Plugin.RecentlyAddedBadges/Jellyfin.Plugin.RecentlyAddedBadges.csproj --configuration Release --no-restore
